w_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1 检出仓库
        uses: actions/checkout@v4

      - name: 2 环境
        run: |
          set -e
          xcodebuild -version
          sw_vers
          echo "---- 仓库根目录 ----"
          ls -la

      # ============================================================
      # 3 找源码：只认 v31（zip 优先，其次文件夹）
      # ============================================================
      - name: 3 定位 v31 源码
        id: locate
        run: |
          set -eu
          echo "==== 只认 v31，别的一概不碰 ===="
          BEST=""

          for z in $(ls -1 *.zip 2>/dev/null | grep -iE 'v31\.[0-9]+' | sort -rV || true); do
            [ -f "$z" ] || continue
            echo "---- 试包：$z ----"
            rm -rf _src
            mkdir -p _src
